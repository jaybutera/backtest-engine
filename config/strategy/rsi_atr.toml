# RSI-ATR pullback, the demo strategy, on the three contracts it ran on.
# The rules are in scripts/rhai/rsi_atr.rhai; the per-contract parameters
# are the ones each leg was traded with, and they were not fitted here:
#
#   ES  30-minute windows  EMA 200  RSI 40 / 60  stop 1 ATR  target 2.5 R  8 h cooldown after 2 losses
#   NQ  15-minute windows  EMA 200  RSI 40 / 60  stop 1 ATR  target 2.5 R  no cooldown
#   GC  30-minute windows  EMA 100  RSI 35 / 65  stop 1 ATR  target 2.5 R  no cooldown
#
# [script] holds the keys shared by every leg and [script.per_asset.<ASSET>]
# the ones a leg changes; init() in the script merges the block for the
# asset it is built for over the shared keys. Each asset runs as its own
# strategy instance on its own thread and the report merges the ledgers.
#
# Data: data/<ASSET>_1m.parquet, the continuous front-month series that
# scripts/fetch-databento.py writes (GLBX.MDP3, ES.FUT / NQ.FUT / GC.FUT,
# ohlcv-1m, stitched unadjusted at a volume-based daily roll). roll_adjust
# removes the roll gaps at load. Fees are the full-size contracts.
#
#   scripts/backtest.sh                                          # every leg, the full data range
#   scripts/backtest.sh -a ES --from 2019-09-01 --warmup-days 60  # one leg, as in the README table
#   scripts/backtest.sh -a NQ --from 2019-09-01 --warmup-days 60
#   scripts/backtest.sh -a GC --from 2010-07-01 --warmup-days 60
factory = "rhai"
assets = ["ES", "NQ", "GC"]
roll_adjust = true

[[contract]]
asset = "ES"
point_value = 50.0
round_turn = 4.30
schedule = "futures_full"

[[contract]]
asset = "NQ"
point_value = 20.0
round_turn = 4.30
schedule = "futures_full"

[[contract]]
asset = "GC"
point_value = 100.0
round_turn = 5.30
schedule = "futures_full"

[strategy]
script = "../../scripts/rhai/rsi_atr.rhai"
script_history = 8
min_score = 0.0
rr = 2.5            # the script sets its own geometry; the engine knob is required
max_hold = 4000000000   # no hold timeout: exits are the stop and the target
fees = true

# Shared by every leg. A leg's block below replaces single keys.
[script]
tf_secs = 900
ema_period = 200
rsi_period = 14
rsi_buy = 40.0
rsi_sell = 60.0
atr_period = 14
sl_atr_mult = 1.0
rr = 2.5
cooldown_losses = 0
cooldown_hours = 0.0

[script.per_asset.ES]
tf_secs = 1800
cooldown_losses = 2
cooldown_hours = 8.0

[script.per_asset.GC]
tf_secs = 1800
ema_period = 100
rsi_buy = 35.0
rsi_sell = 65.0
