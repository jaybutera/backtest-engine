# Fill lens: pure resting limit.
#
# Books a trade only when a candle AFTER the signal bar actually reaches the
# resting entry limit. The signal bar itself is never eligible — at the moment
# that bar printed, the order did not exist yet. If price never reaches the
# entry before the cancel horizon, no trade is recorded.
#
# Fills land at exactly the entry price, with no slippage.
#
# This is the strictest model of WHEN a fill may happen, and it is deliberately
# one-sided: it excludes entries that live would have filled immediately, so it
# understates a strategy that legitimately gets those fills. Read it as the
# late-fill corner of the envelope, not as an estimate.

[fill]
allow_signal_bar_fill = false
entry_slippage_r = 0.0
intrabar_stop_first = true
