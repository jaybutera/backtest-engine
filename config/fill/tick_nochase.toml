# Fill lens: tick-resolution fills, chase disabled.
#
# `tick.toml` with the entry chase turned off: an entry fills only if a tick
# actually reaches the limit price. When price approaches and turns away without
# touching, the entry is simply missed.
#
# The pair exists to measure what the chase is worth. Run both over the same
# window and the difference is the entries a chasing execution would have taken
# and a purely passive one would not — which is also the set of entries most
# sensitive to how fast your execution actually is.

[fill]
entry_fill_mode = "tick"
tick_chase = false
allow_signal_bar_fill = false
intrabar_stop_first = true
