# Fill lens: tick-resolution fills.
#
# The other lenses resolve fills against 1-minute OHLC bars, where the order of
# events inside the bar is unknowable and has to be guessed by
# `intrabar_stop_first`. This lens walks the actual trade prints inside each bar
# and acts on the first tick that crosses each level, so the guess disappears.
#
#   Entry      A resting limit fills maker at the entry price on the first tick
#              that reaches it, stamped with that tick's timestamp.
#
#   Chase      If a tick reaches the chase boundary E ± chase_r × R before any
#              tick touches E, the entry fills taker at the boundary. Whichever
#              level a tick reaches first in real time wins. With this branch
#              disabled (see tick_nochase.toml) every chase becomes a no-fill,
#              which systematically drops entries a live chase would have taken.
#
#   Stop / TP  Whichever price touches first in tick time wins, replacing the
#              stop-first heuristic entirely.
#
#   Mid-bar    A trade filled mid-bar is raced against the remaining ticks of
#              that same bar. Its hold clock still starts on the next bar.
#
# Requires tick data at data/<stem>_ticks.parquet, with columns timestamp,
# price, size, side. A bar with no ticks — a quiet minute, or a gap in the
# archive — falls back to the OHLC logic for that bar rather than failing the
# run, and the report says how often that happened. Read that number: a lens
# that fell back on most bars is an OHLC lens wearing a tick label.
#
# Honest limits. These are real trade-price crossings, which is the point. But
# this models a trade printing through your price, NOT queue position: a passive
# limit is assumed filled when any trade prints through it, which is optimistic
# for a resting order in a deep book. L2 queue realism is out of scope.

[fill]
entry_fill_mode = "tick"
tick_chase = true
allow_signal_bar_fill = false
# Ignored in tick mode, where real tick order decides. Kept at the pessimistic
# default for bars that fall back to OHLC.
intrabar_stop_first = true
