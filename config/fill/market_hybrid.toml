# Fill lens: hybrid resting-limit with a chase watchdog.
#
# The most detailed of the bundled lenses, and the closest to how a real
# resting order behaves. It models a GTC limit placed one candle late, watched
# by a process that will aggress into the market if price starts to leave
# without it.
#
# Let T be the signal bar and D the first candle after it. T is never eligible:
# the order did not exist while it printed. Then:
#
#   Case A — D opens at or past the entry. The limit is marketable on arrival
#            and aggresses immediately: taker fill at D's open.
#
#   Case B — D opens in front of the entry. The order rests. From here it can
#            fill maker at the entry if price comes back; fill taker at the
#            chase boundary (entry ± chase_r × R) if the watchdog fires and
#            aggresses; or abandon the entry entirely — because price gapped
#            through the stop, because the target was reached while still
#            unfilled, or because the order aged out.
#
# `chase_r` does double duty: it gates whether a chase fires at all, and it caps
# how far past the entry the resulting fill may land. A chase that would fill
# worse than the cap abandons instead.
#
# `entry_fill_mode = "hybrid"` overrides `allow_signal_bar_fill` and
# `entry_slippage_r`; the binary warns if either is also set.

[fill]
entry_fill_mode = "hybrid"
chase_r = 0.1
chase_requires_seed = true
immediate_chase_at_open = true
past_entry_fee = "taker"
intrabar_stop_first = true
