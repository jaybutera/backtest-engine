# Fill lens: pure resting limit, plus entry slippage.
#
# The `limit_only` fill model with a 0.1R worse entry price on every fill. P&L
# is still divided by the planned R, so each trade drifts about -0.1R: a stopped
# loss reads -1.1R, a planned +3R win reads +2.9R.
#
# Use it to answer one question — how much of a result survives paying 0.1R at
# the door.

[fill]
allow_signal_bar_fill = false
entry_slippage_r = 0.1
intrabar_stop_first = true
