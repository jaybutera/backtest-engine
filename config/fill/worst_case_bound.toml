# Fill lens: worst-case bound.
#
# Optimistic about WHEN a fill happens, pessimistic about PRICE. The signal bar
# is eligible to fill, which recovers the entries `limit_only` throws away, but
# every fill takes a price 0.1R worse than intended.
#
# The two errors point in opposite directions on purpose. Crossing this lens
# with `limit_only` brackets a strategy: if it survives both, the result is not
# an artifact of fill assumptions. Use it as a sensitivity anchor. The R it
# reports is not meant to be believed on its own.

[fill]
allow_signal_bar_fill = true
entry_slippage_r = 0.1
intrabar_stop_first = true
